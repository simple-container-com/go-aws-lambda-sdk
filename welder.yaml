schemaVersion: "1.8.1"
projectName: go-aws-lambda-sdk
projectRoot: .
version: ${env:VERSION:0.0.0}
default:
  build:
    env:
      CGO_ENABLED: 0
      GOOS: ${os:name}
      GOARCH: ${os:arch}
    args:
      package: github.com/simple-container-com/go-aws-lambda-sdk
profiles:
  skip-test:
    activation:
      skip-tests: true
    build:
      env:
        SKIP_TESTS: "true"
modules:
  - name: go-aws-lambda-sdk
    build:
      steps:
        - task: tools
        - task: linters
        - task: test
    deploy:
      environments:
        prod:
          autoDeploy: true
      steps:
        - task: tag-release
tasks:
  local:
    runOn: host
    env:
      LOCAL_DEBUG: true
      API_KEY: ${env:API_KEY:test}
    script:
      - env
      - go run ./cmd/go-aws-lambda-sdk
  tools:
    runOn: host
    script:
      # Pinned deliberately. The previous form derived the list from
      # tools.go and ran `go get` with no version, so every `welder make`
      # re-floated these to latest: a local build moved mockery 2.53.5 to
      # 2.53.6 and gofumpt 0.9.2 to 0.11.0, and any developer who
      # committed afterwards undid whatever the last dependency pass had
      # pinned. Keep this list in step with the imports in tools.go.
      - go get github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - go get github.com/swaggo/swag/cmd/swag@v1.16.6
      - go get github.com/vektra/mockery/v2@v2.53.5
      - go get mvdan.cc/gofumpt@v0.9.2
      - go mod download
      - go generate -tags tools
      - go mod tidy
  fmt:
    runOn: host
    script:
      - go mod tidy
      - ${project:root}/bin/gofumpt -l -w ./
      - ${project:root}/bin/golangci-lint run --fix
  test:
    runOn: host
    script:
      - if [ "${SKIP_TESTS}" != 'true' ]; then go test ./...; else echo "Skipping tests"; fi
  linters:
    runOn: host
    script:
      - ${project:root}/bin/golangci-lint run --fast --timeout 5m
  tag-release:
    runOn: host
    script:
      # Creating the tag may legitimately fail on a re-run of the same
      # version, so that one stays tolerant. The push must not be: it is
      # the step that actually publishes the release, and swallowing its
      # exit code meant a broken push credential produced a green build
      # that silently shipped nothing.
      - git tag ${project:version} || echo "Tag ${project:version} already exists locally"
      - git push -f origin ${project:version}
